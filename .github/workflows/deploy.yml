# zhuquanming/minspring-build / .github/workflows/deploy.yml
#
# minspring.cn 构建+部署管线(pub-reboot-billing 选项 d 变体):
# 本仓库 PUBLIC → Actions 分钟数免费不限量,根治私有仓库 2000 min/月 额度耗尽问题。
# 源码保持在 private 仓库 astro-notion-blog,用 SOURCE_REPO_TOKEN 拉取构建。
# 构建产物 dist/ 提交回本仓库(构建内容放 public,代码留 private)。
# 部署(2026-09-02 起改拉取式):阿里云 cron 调 minspring-pull.sh,经
# api.github.com 拉 main tarball → 校验 → 原子切 current。本流程不再
# SSH 登录服务器(根除云安全中心每日"非常用地登录"告警)。
#
# Secrets(仅本仓库):SOURCE_REPO_TOKEN / NOTION_API_SECRET / DATABASE_ID。
# fork PR 拿不到 secrets(GitHub 默认安全行为)。
#
# 手动触发:gh workflow run deploy.yml -R zhuquanming/minspring-build

name: Build & Deploy CN

on:
  schedule:
    # 04:22 (Beijing UTC+8) 每日从 Notion 重建,错开 .org 的 03:52 构建
    - cron: '22 20 * * *'
  workflow_dispatch:

concurrency:
  group: deploy-cn
  cancel-in-progress: false

permissions:
  contents: write # 把构建产物提交回本仓库

jobs:
  deploy:
    name: Build CN variant (server pulls dist)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: zhuquanming/astro-notion-blog
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: main
          path: src-repo
          # 不让 private repo 的 token 留在 git 凭据里
          persist-credentials: false

      - name: Checkout public mirror (this repo)
        uses: actions/checkout@v4
        with:
          path: mirror

      - uses: actions/setup-node@v4
        with:
          node-version-file: src-repo/.nvmrc
          cache: npm
          cache-dependency-path: src-repo/package-lock.json

      - name: Install dependencies
        working-directory: src-repo
        run: npm ci

      - name: Build CN variant
        working-directory: src-repo
        env:
          SITE_VARIANT: cn
          CUSTOM_DOMAIN: minspring.cn
          NOTION_API_SECRET: ${{ secrets.NOTION_API_SECRET }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: npm run build

      - name: Commit dist to public mirror
        id: dist_commit
        run: |
          rsync -a --delete src-repo/dist/ mirror/dist/
          cd mirror
          git config user.name 'minspring-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add dist
          if git diff --cached --quiet; then
            echo 'dist unchanged, skip commit'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m "build: refresh dist $(date -u +%Y%m%dT%H%M%SZ)"
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Kick CF deploy hook (content changed only)
        # 两站同源(同一 Notion 库):cn 构建发现内容变化才踢 .org 重建,
        # 内容不变不浪费 CF 构建额度。前提已验证:dist 无构建时间戳,
        # 内容不变则逐字节不变。
        if: steps.dist_commit.outputs.changed == 'true'
        env:
          HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo '::warning::DEPLOY_HOOK_URL not set, skip org rebuild kick'
            exit 0
          fi
          curl -fsS -X POST --max-time 30 "$HOOK_URL" && echo 'org rebuild kicked'

      - name: Verify live site
        if: github.event_name != 'schedule'
        run: |
          sleep 2
          curl -fsS "https://minspring.cn/" -o /dev/null -w "home %{http_code}\n"
          echo "--- robots.txt ---"
          curl -fsS "https://minspring.cn/robots.txt" | head -3
          echo "--- ICP in footer ---"
          curl -fsS "https://minspring.cn/" | grep -o '蜀ICP备[0-9]*号' | head -1
